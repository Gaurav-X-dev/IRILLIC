<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">

  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#eef1f4"/>
      <stop offset="1" stop-color="#c9d1d8"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b333b"/>
      <stop offset="1" stop-color="#11161b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1414"/>
      <stop offset="1" stop-color="#0c0606"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9edf1"/>
      <stop offset=".5" stop-color="#a8b1b9"/>
      <stop offset="1" stop-color="#6c757d"/>
    </linearGradient>
    <radialGradient id="floor" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0b2233" stop-opacity=".22"/>
      <stop offset="1" stop-color="#0b2233" stop-opacity="0"/>
    </radialGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="300" cy="418" rx="240" ry="22" fill="url(#floor)"/>
  <!-- tower cart -->
  <rect x="190" y="160" width="190" height="236" rx="14" fill="url(#body)" stroke="#d3d9df"/>
  <rect x="200" y="392" width="170" height="10" rx="4" fill="url(#dark)"/>
  <circle cx="212" cy="410" r="11" fill="#1d2329"/><circle cx="358" cy="410" r="11" fill="#1d2329"/>
  <!-- camera control unit -->
  <rect x="206" y="180" width="158" height="56" rx="8" fill="url(#dark)"/>
  <rect x="216" y="194" width="58" height="26" rx="4" fill="#0a3a52"/>
  <text x="245" y="212" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2bff8a" text-anchor="middle">NIR</text>
  <circle cx="300" cy="207" r="8" fill="#0091D0"/><circle cx="326" cy="207" r="8" fill="#3a444d"/><circle cx="350" cy="207" r="5" fill="#3a444d"/>
  <!-- light source -->
  <rect x="206" y="248" width="158" height="56" rx="8" fill="url(#dark)"/>
  <circle cx="236" cy="276" r="14" fill="#11161b" stroke="#0091D0" stroke-width="3"/>
  <rect x="266" y="268" width="84" height="16" rx="8" fill="#26303a"/>
  <rect x="266" y="268" width="56" height="16" rx="8" fill="#0091D0"/>
  <!-- recorder -->
  <rect x="206" y="316" width="158" height="40" rx="8" fill="#e3e8ec" stroke="#cdd4da"/>
  <rect x="220" y="330" width="70" height="10" rx="5" fill="#b9c2ca"/>
  <rect x="190" y="160" width="190" height="10" rx="5" fill="#0091D0"/>
  <!-- monitor on arm -->
  <rect x="279" y="96" width="12" height="64" fill="url(#metal)"/>
  <rect x="150" y="18" width="270" height="168" rx="12" fill="url(#dark)" transform="translate(0 -6)"/>
  <rect x="163" y="25" width="244" height="142" rx="4" fill="url(#screen)"/><g transform="translate(163 25) scale(0.3050 0.2840)" filter="url(#g)"><path d="M 20 300 C 160 255, 260 335, 380 282 S 600 200, 790 232" fill="none" stroke="#2bff8a" stroke-width="13.5" stroke-linecap="round"/><path d="M 380 282 C 425 342, 470 382, 565 432" fill="none" stroke="#2bff8a" stroke-width="8.1" stroke-linecap="round"/><path d="M 232 300 C 252 222, 302 168, 362 112" fill="none" stroke="#2bff8a" stroke-width="7.2" stroke-linecap="round"/><path d="M 600 214 C 640 160, 690 118, 770 86" fill="none" stroke="#2bff8a" stroke-width="6.3" stroke-linecap="round"/><path d="M 120 282 C 132 352, 172 412, 245 482" fill="none" stroke="#2bff8a" stroke-width="6.3" stroke-linecap="round"/><path d="M 300 128 C 330 140, 345 160, 340 190" fill="none" stroke="#2bff8a" stroke-width="3.6" stroke-linecap="round"/><ellipse cx="524" cy="246" rx="34" ry="25" fill="#3dff96"/></g>
  <!-- laparoscope + camera head -->
  <g transform="translate(24 22) rotate(-28 470 300)">
    <rect x="360" y="292" width="210" height="9" rx="4.5" fill="url(#metal)"/>
    <rect x="566" y="290" width="10" height="13" rx="2" fill="#2bff8a" opacity=".9" filter="url(#g)"/>
    <rect x="320" y="278" width="52" height="38" rx="10" fill="url(#body)" stroke="#c4ccd3"/>
    <rect x="326" y="284" width="8" height="26" rx="4" fill="#0091D0"/>
    <rect x="300" y="286" width="22" height="22" rx="6" fill="url(#dark)"/>
  </g>
  <path d="M 378 368 C 360 400, 420 410, 400 372" fill="none" stroke="#2b333b" stroke-width="5" stroke-linecap="round"/>
</svg>